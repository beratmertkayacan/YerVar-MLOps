# CI: her push'ta ve her pull request'te kodu kontrol eder.
#
# Üç soru soruyor:
#   1. Kod stili kurallara uyuyor mu?      (ruff)
#   2. Testler geçiyor mu?                 (pytest)
#   3. Docker imajı derlenebiliyor mu?     (docker build)
# Biri bile kırmızıysa o commit'i buluta göndermiyoruz.
#
# Bu iş sadece kontrol ediyor; Azure'a hiçbir şey göndermiyor, hiçbir sır
# kullanmıyor. Buluta gönderme (CD) ayrı bir iş olacak.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Stil ve testler
    # ubuntu-latest: Sürümü sabitliyoruz,
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Docker imajıyla ve  Mac ile aynı Python sürümü 
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gereksinimler*.txt

      - name: Bağımlılıkları kur
        run: pip install -r gereksinimler-gelistirme.txt

      # kesif/ bilerek dışarıda: keşif scriptleri üretim kodu değil.
      - name: Kod stili (ruff)
        run: ruff check yervar testler

      - name: Testler (pytest)
        run: pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  imaj:
    name: Docker imajı derleniyor mu
    runs-on: ubuntu-24.04
    needs: test   # testler geçmeden derlemeye uğraşmıyoruz
    steps:
      - uses: actions/checkout@v7
      - name: İmajı derle (göndermeden)
        run: docker build -t yervar:ci .
